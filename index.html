<!-- Generated with Perplexity Pro -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Working Clock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #181c20;
      color: #f3f3f3;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .clock-container {
      background: #23272f;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      padding: 40px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .digital-clock {
      font-size: 3rem;
      letter-spacing: 0.1em;
      font-weight: bold;
      margin-bottom: 24px;
      color: #00e0ff;
      text-shadow: 0 2px 8px #00e0ff44;
    }
    .date {
      font-size: 1.2rem;
      color: #b0b8c1;
      margin-bottom: 32px;
    }
    .analog-clock {
      position: relative;
      width: 220px;
      height: 220px;
      background: #181c20;
      border: 8px solid #00e0ff;
      border-radius: 50%;
      box-shadow: 0 2px 16px #00e0ff33;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #00e0ff;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      box-shadow: 0 0 8px #00e0ff99;
    }
    .hand {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: bottom center;
      background: #00e0ff;
      border-radius: 4px;
      z-index: 5;
    }
    .hand.hour {
      width: 10px;
      height: 60px;
      background: #00e0ff;
      margin-left: -5px;
      margin-top: -60px;
      box-shadow: 0 0 8px #00e0ff55;
    }
    .hand.minute {
      width: 6px;
      height: 90px;
      background: #00ffd0;
      margin-left: -3px;
      margin-top: -90px;
      box-shadow: 0 0 8px #00ffd055;
    }
    .hand.second {
      width: 2px;
      height: 100px;
      background: #ff0055;
      margin-left: -1px;
      margin-top: -100px;
      box-shadow: 0 0 8px #ff005555;
    }
    .number {
      position: absolute;
      width: 32px;
      height: 32px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: #00e0ff;
      text-shadow: 0 1px 4px #00e0ff44;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="clock-container">
    <div class="digital-clock" id="digitalClock">00:00:00</div>
    <div class="date" id="dateDisplay"></div>
    <div class="analog-clock" id="analogClock">
      <div class="center-dot"></div>
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="hand second" id="secondHand"></div>
      <!-- Numbers will be inserted by JS -->
    </div>
  </div>
  <script>
    // Insert clock numbers
    const analogClock = document.getElementById('analogClock');
    for (let n = 1; n <= 12; n++) {
      const angle = (n - 3) * (Math.PI * 2) / 12;
      const x = 100 + Math.cos(angle) * 85;
      const y = 100 + Math.sin(angle) * 85;
      const number = document.createElement('div');
      number.className = 'number';
      number.style.left = `${x}px`;
      number.style.top = `${y}px`;
      number.textContent = n;
      analogClock.appendChild(number);
    }

    function pad(num) {
      return num < 10 ? '0' + num : num;
    }

    function updateClock() {
      const now = new Date();
      // Digital clock
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      document.getElementById('digitalClock').textContent =
        `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

      // Date display
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('dateDisplay').textContent =
        now.toLocaleDateString(undefined, options);

      // Analog clock
      const hourDeg = ((hours % 12) + minutes / 60) * 30;
      const minDeg = (minutes + seconds / 60) * 6;
      const secDeg = seconds * 6;

      document.getElementById('hourHand').style.transform =
        `translate(-50%, 0) rotate(${hourDeg}deg)`;
      document.getElementById('minuteHand').style.transform =
        `translate(-50%, 0) rotate(${minDeg}deg)`;
      document.getElementById('secondHand').style.transform =
        `translate(-50%, 0) rotate(${secDeg}deg)`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
